<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Tentacle Calculator</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#f1f5f9;color:#102238;margin:0;padding:24px}main{max-width:440px;margin:35px auto;background:white;border-radius:20px;padding:26px;box-shadow:0 8px 30px #10223818}h1{font-size:25px;margin:0 0 7px}p{color:#64748b}label{display:block;margin:25px 0 9px;font-weight:600}input{box-sizing:border-box;width:100%;padding:16px;font-size:23px;border:2px solid #94a3b8;border-radius:12px}.result{background:#eef5ff;padding:16px;border-radius:12px;margin-top:13px}.result span{display:block;color:#475569;font-size:14px}.result strong{display:block;font-size:29px;margin-top:5px}small{display:block;margin-top:20px;color:#64748b;line-height:1.5}</style></head><body><main><h1>Tentacle Calculator</h1><p>Enter tube inside diameter (inches).</p><label for="tube">Tube ID (in)</label><input id="tube" type="number" step="any" min="0" value="0.750" inputmode="decimal"><div class="result"><span>Wire diameter</span><strong id="wire">—</strong></div><div class="result"><span>Tentacle wavelength / pitch</span><strong id="wave">—</strong></div><div class="result"><span>Tentacle inside diameter</span><strong id="tentacle">—</strong></div><small>All results in inches. Ratios: tube ID ÷ 15, tube ID ÷ 1.15385, and tube ID ÷ 5.35714.</small></main><script>const input=document.getElementById('tube');function update(){const d=Number(input.value);for(const [id,div] of [['wire',15],['wave',1.15385],['tentacle',5.35714]])document.getElementById(id).textContent=input.value.trim()!==''&&Number.isFinite(d)&&d>0?(d/div).toFixed(4)+' in':'—'}input.addEventListener('input',update);update()</script></body></html>
